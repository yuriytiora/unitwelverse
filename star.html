<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UNITWELVERSE // Ядро Звезды</title>
    <style>
        :root { 
            --bg-space: #05060f; 
            --neon-glow: #2b5a8c; /* Цвет рамок (остался прежним) */
            --text-glow: #3a6b9e; /* Текст внутри кнопок сделали на 20% тусклее (было #4a90e2) */
            --text-main: #ffffff; 
            --accent-gold: #ffd700; 
            --panel-bg: rgba(0, 0, 0, 0.3); 
            --glass-bg: rgba(5, 10, 20, 0.9);
        }
        * { box-sizing: border-box; }
        html, body { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-space); 
            color: var(--text-main); 
        }

        /* --- ФОН (ПК) --- */
        body { 
            background-image: url('cockpit.webp'); 
            background-size: cover; 
            background-position: center;
            background-attachment: fixed;
        }

        .cockpit {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            z-index: 1;
        }

        /* Верхняя навигация (ПК) */
        .top-nav {
            display: flex;
            gap: 10px;
            z-index: 10;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
        }
        
        /* ЕДИНЫЙ СТИЛЬ ДЛЯ ВСЕХ КНОПОК */
        .ui-btn, .data-block {
            background: var(--panel-bg);
            border: 1px solid var(--neon-glow);
            color: var(--text-glow); /* Использует приглушенный цвет */
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
            font-weight: normal;
            box-shadow: 0 0 5px rgba(43, 90, 140, 0.1);
            text-transform: uppercase;
        }

        /* Размеры и отступы */
        .ui-btn {
            padding: 8px 15px;
            font-size: 11px;
            letter-spacing: 1px;
            min-width: 100px;
        }
        
        .data-block {
            padding: 8px 10px;
            font-size: 10px;
            letter-spacing: 1px;
        }

        /* Эффекты наведения */
        .ui-btn:hover, .data-block:hover { 
            background: rgba(43, 90, 140, 0.2); 
            box-shadow: 0 0 15px var(--neon-glow); 
        }
        
        /* Активная кнопка (Звезды) */
        .ui-btn.active { 
            background: var(--panel-bg); 
            color: var(--text-glow); 
            box-shadow: 0 0 10px rgba(43, 90, 140, 0.3); 
        }

        /* Внутренний текст (для нижних кнопок) */
        .data-block strong { 
            display: block; 
            font-size: 10px; 
            color: var(--text-glow); /* Приглушенный цвет */
            text-transform: uppercase; 
            letter-spacing: 1px; 
            margin-bottom: 0; 
            font-weight: normal; 
        }
        .data-block span { display: none; }

        /* Основная зона */
        .main-zone {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            max-width: 1400px;
        }

        /* Панели данных (ПК) */
        .left-panel, .right-panel {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 15;
            width: 200px;
        }
        .left-panel { left: 20px; }
        .right-panel { right: 20px; }

        /* Портрет */
        .center-portrait {
            position: relative;
            z-index: 5;
            width: 300px; 
            height: 300px; 
            border-radius: 30px; 
            border: 2px solid var(--neon-glow);
            box-shadow: 0 0 30px rgba(43, 90, 140, 0.3), inset 0 0 20px rgba(0,0,0,0.8);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }
        .center-portrait img { width: 100%; height: 100%; object-fit: cover; }

        /* Кнопка "Контент" на ПК */
        .content-btn-container {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        /* Нижняя панель (Титулы) */
        .bottom-panel {
            width: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding-bottom: 10px;
        }
        .titles-grid { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .title-badge {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 10px;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
            font-weight: normal;
        }

        /* Свитки */
        .scroll-panel {
            position: fixed;
            left: 0;
            width: 100%;
            height: 65vh;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 20;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .scroll-top { top: 0; transform: translateY(-100%); border-bottom: 2px solid var(--neon-glow); border-radius: 0 0 20px 20px; }
        .scroll-top.open { transform: translateY(0); }
        .scroll-bottom { bottom: 0; transform: translateY(100%); border-top: 2px solid var(--neon-glow); border-radius: 20px 20px 0 0; }
        .scroll-bottom.open { transform: translateY(0); }

        .scroll-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; margin-bottom: 10px; }
        .scroll-title { color: var(--text-glow); font-size: 16px; text-transform: uppercase; letter-spacing: 2px; font-weight: normal; }
        .close-btn { background: transparent; border: 1px solid var(--neon-glow); color: var(--neon-glow); padding: 5px 10px; border-radius: 5px; cursor: pointer; }
        
        .comrade-item { display: flex; align-items: center; gap: 15px; padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; transition: background 0.2s; }
        .comrade-item:hover { background: rgba(43, 90, 140, 0.1); }
        .comrade-avatar { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--neon-glow); background: #000; object-fit: cover; }
        .comrade-info { display: flex; flex-direction: column; }
        .comrade-name { font-size: 14px; font-weight: normal; }
        .comrade-status { font-size: 11px; color: #a0aec0; }

        .content-card { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; margin-bottom: 10px; }
        .content-card h4 { margin: 0 0 5px 0; color: var(--text-glow); font-weight: normal; }
        .content-card p { margin: 0; font-size: 13px; color: #cbd5e1; }

        /* --- МОДАЛЬНОЕ ОКНО --- */
        .info-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: rgba(5, 15, 25, 0.95);
            backdrop-filter: blur(20px);
            border: 2px solid var(--neon-glow);
            border-radius: 20px;
            padding: 25px;
            z-index: 100;
            text-align: center;
            width: 80%;
            max-width: 400px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 50px rgba(43, 90, 140, 0.3);
        }
        .info-modal.open {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }
        .info-modal img { max-width: 100px; border-radius: 10px; margin-bottom: 15px; border: 1px solid var(--neon-glow); }
        .info-modal h3 { color: var(--text-glow); margin: 0 0 10px 0; text-transform: uppercase; letter-spacing: 2px; font-weight: normal; }
        .info-modal p { color: #e2e8f0; font-size: 14px; line-height: 1.5; }
        .modal-close { position: absolute; top: 10px; right: 15px; background: transparent; border: none; color: var(--neon-glow); font-size: 20px; cursor: pointer; }

        /* --- АДАПТИВНОСТЬ ДЛЯ СМАРТФОНОВ --- */
        @media (max-width: 1024px) {
            body {
                background-image: url('cockpit4.webp'); 
                background-size: cover;
                background-position: center;
            }

            .cockpit { padding: 10px; }

            .top-nav { display: contents; } 
            .nav-btn-top {
                position: absolute;
                padding: 6px 10px;
                font-size: 10px;
                min-width: 90px;
                z-index: 15;
            }
            .nav-btn-top:nth-child(1) { top: 4%; left: 35%; transform: translateX(-50%); } 
            .nav-btn-top:nth-child(2) { top: 8%; left: 50%; transform: translateX(-50%); } 
            .nav-btn-top:nth-child(3) { top: 4%; left: 65%; transform: translateX(-50%); } 

            .main-zone {
                flex-direction: column;
                justify-content: flex-start;
                padding-top: 0;
                height: 100%;
            }

            .center-portrait {
                position: absolute;
                top: 45%; 
                left: 50%;
                transform: translate(-50%, -50%);
                width: 180px; 
                height: 180px; 
                border-radius: 20px; 
                margin: 0; 
                z-index: 10;
            }

            .left-panel, .right-panel { display: contents; }

            .data-block {
                position: absolute;
                padding: 6px 10px;
                z-index: 15;
            }
            .data-block strong { font-size: 10px; margin-bottom: 0; font-weight: normal; }

            .left-panel .data-block:nth-child(1) { top: 86%; left: 33%; transform: translateX(-50%); } 
            .left-panel .data-block:nth-child(2) { top: 86%; left: 66%; transform: translateX(-50%); } 
            .right-panel .data-block:nth-child(1) { top: 11%; left: 50%; transform: translateX(-50%); }  
            .right-panel .data-block:nth-child(2) { top: 83%; left: 50%; transform: translateX(-50%); } 

            .content-btn-container {
                position: absolute;
                top: 78%; 
                left: 50%;
                transform: translateX(-50%);
                z-index: 15;
            }
            .content-btn { padding: 8px 20px; font-size: 11px; }

            .bottom-panel { display: none; }
        }
    </style>
</head>
<body>

    <!-- Модальное окно -->
    <div class="info-modal" id="info-modal">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <div id="modal-content"></div>
    </div>

    <!-- Свитки -->
    <div class="scroll-panel scroll-top" id="scroll-comrades">
        <div class="scroll-header">
            <div class="scroll-title">Звезды (Соратники)</div>
            <button class="close-btn" onclick="toggleScroll('scroll-comrades')">✕</button>
        </div>
        <div id="comrades-list"></div>
    </div>

    <div class="scroll-panel scroll-bottom" id="scroll-content">
        <div class="scroll-header">
            <div class="scroll-title">Контент (Лента)</div>
            <button class="close-btn" onclick="toggleScroll('scroll-content')">✕</button>
        </div>
        <div>
            <div class="content-card"><h4>📺 Видео: Интро</h4><p>Короткий ролик о рождении идеи.</p></div>
            <div class="content-card"><h4>💬 Диалог с ИИ</h4><p>Аудит по 12 Спутникам.</p></div>
            <div class="content-card"><h4>📰 Новость</h4><p>Владимир опубликовал данные о мерзлоте.</p></div>
        </div>
    </div>

    <div class="cockpit" id="profile-container"></div>

    <script>
        const selectedComrade = localStorage.getItem('selectedComrade') || 'michael';
        
        const database = {
            'michael': { 
                name: 'Майкл', country: 'США', sphere: 'Киберсфера', 
                project: 'ИИ-бот для киберзащиты', image: 'michael.webp', 
                titles: ['Звезда Инициативы', 'Чемпион Исследований'],
                countryInfo: 'Соединенные Штаты Америки — лидер в сфере IT и кибербезопасности.',
                sphereInfo: 'Киберсфера — область цифровых технологий, защиты данных и ИИ.',
                projectInfo: 'Разработка ИИ-бота, способного предсказывать и предотвращать кибератаки.',
                flag: 'https://flagcdn.com/w320/us.png'
            },
            'vladimir': { 
                name: 'Владимир', country: 'Россия', sphere: 'Геосфера', 
                project: 'Станции мониторинга мерзлоты', image: 'birch.jpg', 
                titles: ['Звезда Инициативы', 'Фронтмен Возрождения'],
                countryInfo: 'Россия — страна с огромными природными ресурсами и территорией.',
                sphereInfo: 'Геосфера — область изучения земли, климата и природных ресурсов.',
                projectInfo: 'Создание модульных станций для контроля состояния вечной мерзлоты.',
                flag: 'https://flagcdn.com/w320/ru.png'
            },
            'dilnoza': { 
                name: 'Дильноза', country: 'Узбекистан', sphere: 'Образование', 
                project: 'Платформа цифрового наставничества', image: 'bee.jpg', 
                titles: ['Звезда Инициативы', 'Гуру Коллаборации'],
                countryInfo: 'Узбекистан — страна с богатой историей и молодым населением.',
                sphereInfo: 'Образование — сфера передачи знаний и развития личности.',
                projectInfo: 'Платформа для наставничества подростков в удаленных регионах.',
                flag: 'https://flagcdn.com/w320/uz.png'
            }
        };
        const data = database[selectedComrade] || database['michael'];
        const container = document.getElementById('profile-container');

        const titlesHTML = data.titles.map(t => `<div class="title-badge">${t}</div>`).join('');

        const comrades = [
            { id: 'vladimir', name: 'Владимир', status: 'Геосфера', img: 'birch.jpg' },
            { id: 'dilnoza', name: 'Дильноза', status: 'Образование', img: 'bee.jpg' }
        ];
        const otherComrades = comrades.filter(c => c.id !== selectedComrade);
        
        const comradesHTML = otherComrades.map(c => `
            <div class="comrade-item" onclick="alert('Переход в профиль ${c.name} (в разработке)')">
                <img src="${c.img}" class="comrade-avatar" onerror="this.src='https://yuriytiora.github.io/unitwelve/be3.webp'">
                <div class="comrade-info"><div class="comrade-name">${c.name}</div><div class="comrade-status">${c.status}</div></div>
            </div>
        `).join('');

        container.innerHTML = `
            <div class="top-nav">
                <button class="ui-btn nav-btn-top" onclick="window.location.href='bigdata.html'">BIG DATA</button>
                <button class="ui-btn nav-btn-top active" onclick="toggleScroll('scroll-comrades')">ЗВЕЗДЫ</button>
                <button class="ui-btn nav-btn-top" onclick="window.location.href='comrade-profile.html'">ПУЛЬТ</button>
            </div>

            <div class="main-zone">
                <div class="left-panel">
                    <div class="data-block" onclick="showInfo('country')">
                        <strong>Страна</strong>
                    </div>
                    <div class="data-block" onclick="showInfo('sphere')">
                        <strong>Сфера</strong>
                    </div>
                </div>

                <div class="center-portrait">
                    <img src="${data.image}" alt="Портрет" onerror="this.src='https://yuriytiora.github.io/unitwelve/be3.webp'">
                </div>

                <div class="content-btn-container">
                    <button class="ui-btn" onclick="toggleScroll('scroll-content')">КОНТЕНТ</button>
                </div>

                <div class="right-panel">
                    <div class="data-block" onclick="showInfo('project')">
                        <strong>Проект</strong>
                    </div>
                    <div class="data-block" onclick="alert('Запрос на контакт отправлен ${data.name}!')">
                        <strong>Контакт</strong>
                    </div>
                </div>
            </div>

            <div class="bottom-panel">
                <div class="titles-grid">${titlesHTML}</div>
                <a href="comrades.html" style="color:#64748b; font-size:11px; text-decoration:none; margin-top:10px; display:inline-block;">← Вернуться к Соратникам</a>
            </div>
        `;

        document.getElementById('comrades-list').innerHTML = comradesHTML;

        function toggleScroll(id) {
            const el = document.getElementById(id);
            document.querySelectorAll('.scroll-panel').forEach(panel => {
                if (panel.id !== id) panel.classList.remove('open');
            });
            el.classList.toggle('open');
        }

        function showInfo(type) {
            const modal = document.getElementById('info-modal');
            const content = document.getElementById('modal-content');
            let html = '';

            if (type === 'country') {
                html = `<img src="${data.flag}" alt="Флаг"><h3>${data.country}</h3><p>${data.countryInfo}</p>`;
            } else if (type === 'sphere') {
                html = `<h3>${data.sphere}</h3><p>${data.sphereInfo}</p>`;
            } else if (type === 'project') {
                html = `<h3>${data.project}</h3><p>${data.projectInfo}</p>`;
            }

            content.innerHTML = html;
            modal.classList.add('open');
        }

        function closeModal() {
            document.getElementById('info-modal').classList.remove('open');
        }
    </script>
</body>
</html>

 <style>
 :root {
 --space-bg: #111a3a;
 --neon-blue: #00f0ff;
 --neon-purple: #bd00ff;
 --gold: #ffb800;
 --text-main: #e2e8f0;
 --border-alpha: rgba(0, 240, 255, 0.35);
 --card-bg: rgba(13, 21, 39, 0.95);
 --node-blue: rgba(30, 41, 59, 0.45); 
 }
 body {
 color: var(--text-main);
 font-family: 'Segoe UI', Roboto, sans-serif;
 margin: 0; padding: 0;
 min-height: 100vh;
 display: flex; flex-direction: column;
 overflow: hidden;
 background-color: #000;
 position: relative;
 }
 body::before {
 content: "";
 position: absolute;
 top: 0; left: 0; width: 100%; height: 100%;
 background-image: url('bg3.webp');
 background-size: cover; 
 background-position: center; 
 background-repeat: no-repeat; 
 background-attachment: fixed;
 opacity: 0;
 z-index: 1;
 animation: fadeInCosmos 2.5s cubic-bezier(0.4, 0, 0.2, 1) 3.8s forwards;
 }
 @keyframes fadeInCosmos {
 0% { opacity: 0; }
 100% { opacity: 1; }
 }
 .canvas-container {
 flex-grow: 1; position: relative;
 display: flex; justify-content: center; align-items: center;
 min-height: 100vh; padding: 20px; box-sizing: border-box;
 z-index: 2;
 }
 .geometry-map {
 position: relative; width: 650px; height: 650px;
 display: flex; justify-content: center; align-items: center;
 }
 .geo-element {
 position: absolute; display: flex; justify-content: center; align-items: center;
 cursor: pointer; box-sizing: border-box; z-index: 20;
 transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
 }
 /* --- КВАДРАТЫ СЕТКИ (Проявляются без вращения после центра) --- */
 .square-node {
 width: 54px; height: 54px;
 background: var(--node-blue);
 border: 1px solid rgba(0, 240, 255, 0.15);
 box-shadow: inset 0 0 8px rgba(0,240,255,0.05);
 animation: materializeGrid 1.3s cubic-bezier(0.16, 1, 0.3, 1) 2.5s both;
 }
 .square-node:hover, .square-node.active {
 border-color: rgba(255, 255, 255, 0.8) !important;
 box-shadow: 0 0 22px rgba(255, 255, 255, 0.6), inset 0 0 10px rgba(255, 255, 255, 0.25) !important;
 transform: scale(1.08) !important; 
 z-index: 30;
 }
 @keyframes materializeGrid {
 0% { transform: scale(0); opacity: 0; filter: blur(5px); }
 100% { transform: scale(1); opacity: 1; filter: blur(0px); }
 }
 /* --- ЦЕНТРАЛЬНЫЙ КВАДРАТ-КУБ --- */
 #creator-decree-box {
 position: absolute; width: 54px; height: 54px;
 top: 298px; left: 298px;
 background-color: var(--node-blue) !important;

 display: flex; justify-content: center; align-items: center; text-align: center; font-size: 0px; 
 color: transparent !important; font-weight: bold; letter-spacing: 1.2px; text-transform: uppercase;
 padding: 0px; box-sizing: border-box; pointer-events: auto; cursor: pointer;
 z-index: 40;
 animation: emergeCubeCore 1.2s cubic-bezier(0.16, 1, 0.3, 1) 1.8s both, mainSquarePulse 1.5s ease-in-out infinite 3.8s;
 transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
 }
 @keyframes emergeCubeCore {
 0% { transform: scale(0); opacity: 0; filter: blur(5px); }
 100% { transform: scale(1); opacity: 1; filter: blur(0px); }
 }
 @keyframes mainSquarePulse {
 0%, 100% { border-color: rgba(0, 240, 255, 0.35); box-shadow: inset 0 0 8px rgba(0,240,255,0.05); }
 50% { border-color: rgba(255, 255, 255, 0.8); box-shadow: 0 0 15px rgba(0, 240, 255, 0.4), inset 0 0 12px rgba(0, 240, 255, 0.2); }
 }
 #creator-decree-box.expanded {
 width: 110px; height: 110px;
 top: 270px; left: 270px;
 background-color: #475569 !important;
 border: 2px solid rgba(226, 232, 240, 0.6); border-radius: 8px;
 font-size: 0.65rem; color: #e2e8f0 !important;
 text-shadow: 0 0 6px rgba(255, 255, 255, 0.5);
 padding: 10px;
 animation: activeCoreGlow 3.5s ease-in-out infinite 0.5s !important;
 }
 #creator-decree-box.expanded:hover {
 background-color: #52637a !important; border-color: #ffffff !important;
 box-shadow: 0 0 35px rgba(255, 255, 255, 0.65), inset 0 0 15px rgba(255, 255, 255, 0.25);
 transform: scale(1.04);
 }
 @keyframes activeCoreGlow {
 0%, 100% { box-shadow: 0 0 14px rgba(226, 232, 240, 0.35), inset 0 0 6px rgba(226, 232, 240, 0.15); border-color: rgba(226, 232, 240, 0.5); }
 50% { box-shadow: 0 0 30px rgba(255, 255, 255, 0.7), inset 0 0 12px rgba(255, 255, 255, 0.3); border-color: rgba(255, 255, 255, 0.95); }
 }
 /* --- ПЯТИУГОЛЬНИКИ (Истинный взрыв из центра с помощью CSS-трансформации) --- */
 .pentagon-node {
 width: 54px; height: 52px; 
 overflow: visible !important;
 z-index: 25;
 }
 .pentagon-node polygon {
 fill: rgba(35, 45, 60, 0.4); stroke: rgba(189, 0, 255, 0.25); stroke-width: 2px;
 transition: all 0.3s ease;
 }
 .pentagon-node:hover, .pentagon-node.active {
 transform: scale(1.05) !important; z-index: 35;
 filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.65)) !important;
 }
 .pentagon-node:hover polygon, .pentagon-node.active polygon {
 fill: rgba(35, 45, 60, 0.4) !important; stroke: rgba(255, 255, 255, 0.85) !important; stroke-width: 3px;
 }

 position: absolute; width: 500px; height: 450px;
 background: radial-gradient(circle, rgba(189,0,255,0.07) 0%, rgba(0,240,255,0.03) 50%, rgba(0,0,0,0) 100%);
 pointer-events: none; z-index: 1; opacity: 0;
 animation: fadeInGlow 2s ease-out 3.8s forwards;
 }
 @keyframes fadeInGlow { 0% { opacity: 0; } 100% { opacity: 0.6; } }
 #info-modal {
 display: none; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
 width: 90%; max-width: 550px; background: var(--card-bg); border: 1px solid var(--border-alpha); border-radius: 8px; padding: 20px;
 backdrop-filter: blur(15px); box-shadow: 0 15px 40px rgba(0,0,0,0.8); z-index: 100; box-sizing: border-box;
 }
 .modal-title { font-size: 1.05rem; font-weight: bold; color: var(--neon-blue); margin-bottom: 8px; letter-spacing: 0.5px; text-align: left; }
 .modal-body { font-size: 0.85rem; line-height: 1.5; color: #cbd5e1; text-align: left; }
 .modal-close { position: absolute; top: 12px; right: 15px; background: none; border: none; color: #64748b; cursor: pointer; font-size: 1.1rem; }
 .modal-close:hover { color: var(--gold); }
  /* Адаптивный щит для мобильных экранов смартфонов */
@media (max-width: 680px) {
    .canvas-container {
        padding: 5px;
        overflow: hidden;
    }
    .geometry-map {

        transform: scale(calc(100vw / 680));

        max-height: 100vw;

        margin-top: -120px;
    }
    #info-modal {
        width: 95%;
        bottom: 15px;
        padding: 15px;
    }
}

 const modal = document.getElementById('info-modal');
 const modalTitle = document.getElementById('info-title');

 const coreBox = document.getElementById('creator-decree-box');

 // Изолированный клик по Центральному Ядру
 coreBox.addEventListener('click', (e) => {

 document.querySelectorAll('.geo-element').forEach(node => node.classList.remove('active'));
 coreBox.classList.add('expanded');

 if (info) {

 modalText.innerHTML = info.text;
 modal.style.display = 'block';

 }
 });

 // Изолированный клик по всем остальным элементам (Квадраты и Пятиугольники)
 document.querySelectorAll('.geo-element').forEach(element => {
 element.addEventListener('click', (e) => {
 e.stopPropagation();
 if (e.currentTarget === coreBox) return; // Пропускаем центр, у него своя логика
 
 document.querySelectorAll('.geo-element').forEach(node => node.classList.remove('active'));
 const clickedElement = e.currentTarget;
 clickedElement.classList.add('active');
 
 const dataId = clickedElement.getAttribute('data-id');
 const info = ontologyDatabase[dataId];
 if (info) {
 modalTitle.innerText = info.title;
 modalText.innerHTML = info.text;
 modal.style.display = 'block';
 }
 if (coreBox.classList.contains('expanded')) {
 resetCoreBox();
 }
 });
 });

 function resetCoreBox() {
 coreBox.classList.remove('expanded');
 }

 function closeModal() {
 modal.style.display = 'none';
 document.querySelectorAll('.geo-element').forEach(node => node.classList.remove('active'));

 }

 closeBtn.addEventListener('click', (e) => {

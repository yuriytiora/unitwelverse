    michaelQuestStage = 0;
    document.getElementById('main-cockpit').style.display = 'none';
    document.getElementById('noosphere-auth-gate').style.display = 'none';
    document.getElementById('hud-minimap').style.display = 'none';
    document.getElementById('hud-vcard').style.display = 'none';
    document.querySelector('.responsive-container').style.display = 'flex';
    setTimeout(() => { document.querySelector('.responsive-container').style.opacity = '1'; }, 50);
    document.getElementById('main-cockpit').style.background = "radial-gradient(circle, rgba(16,24,48,0.2) 0%, rgba(0,0,0,0.97) 100%)";
    document.getElementById('interactive-card').style.animation = 'autoNoosphereFlip 6s cubic-bezier(0.4, 0, 0.2, 1) infinite';
}

document.querySelectorAll('.geo-element').forEach(element => {
    element.addEventListener('click', (e) => {
        e.stopPropagation();
        if (e.currentTarget === coreBox) return; 
        document.querySelectorAll('.geo-element').forEach(node => node.classList.remove('active'));
        e.currentTarget.classList.add('active');
        const dataId = e.currentTarget.getAttribute('data-id');
        const info = ontologyDatabase[dataId];
        if (info) {
            modalTitle.innerText = info.title;
            modalText.innerHTML = info.text;
            modal.style.display = 'block';
        }
        if (coreBox.classList.contains('expanded')) { coreBox.classList.remove('expanded'); }
    });
});

closeBtn.addEventListener('click', (e) => { e.stopPropagation(); modal.style.display = 'none'; document.querySelectorAll('.geo-element').forEach(node => node.classList.remove('active')); coreBox.classList.remove('expanded'); });
</script>

body, html {
margin: 0; padding: 0;
width: 100%; height: 100%;
overflow: hidden;
background-color: #000;
font-family: 'Segoe UI', Roboto, sans-serif;
}
body {
position: relative;
display: flex;
justify-content: center;
align-items: center;
}
body::before {
content: "";
position: absolute;
top: 0; left: 0; width: 100%; height: 100%;
background-image: url('bg3.webp');
background-size: cover;
background-position: center center;
background-repeat: no-repeat;
z-index: 1;
}
.responsive-container {
position: relative;
z-index: 2;
width: 100vmin;
height: 100vmin;
max-width: 650px;
max-height: 650px;
display: flex;
justify-content: center;
align-items: center;
box-sizing: border-box;
}
.vector-wrapper {
position: relative;
width: 100%;
height: 100%;
}
.geo-element {
position: absolute;
display: flex;
justify-content: center;
align-items: center;
cursor: pointer;
box-sizing: border-box;
z-index: 20;
transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}
.square-node {
width: 8.3%;
height: 8.3%;
background: var(--node-blue);
border: 1px solid rgba(0, 240, 255, 0.15);
box-shadow: inset 0 0 8px rgba(0,240,255,0.05);
}
.square-node:hover, .square-node.active {
border-color: rgba(255, 255, 255, 0.8) !important;
box-shadow: 0 0 22px rgba(255, 255, 255, 0.6), inset 0 0 10px rgba(255, 255, 255, 0.25) !important;
transform: scale(1.08) !important;
z-index: 30;
}
#creator-decree-box {
position: absolute;
width: 8.3%;
height: 8.3%;
top: 45.85%;
left: 45.85%;
background-color: var(--node-blue) !important;
border: 1px solid rgba(0, 240, 255, 0.35);
display: flex;
justify-content: center;
align-items: center;
text-align: center;
font-size: 0px;
color: transparent !important;
font-weight: bold;
cursor: pointer;
z-index: 40;
transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    /* ДОБАВЛЯЕМ МЕРЦАНИЕ СЮДА: */
animation: mainSquarePulse 2s ease-in-out infinite;
}
#creator-decree-box.expanded {
width: 17%;
height: 17%;
top: 41.5%;
left: 41.5%;
background-color: #475569 !important;
border: 2px solid rgba(226, 232, 240, 0.6);
border-radius: 8px;
font-size: 0.65rem;
color: #e2e8f0 !important;
text-shadow: 0 0 6px rgba(255, 255, 255, 0.5);
padding: 5px;
}
.pentagon-node {
width: 8.3%;
height: 8%;
overflow: visible !important;
z-index: 25;
}
.pentagon-node polygon {
fill: rgba(35, 45, 60, 0.4);
stroke: rgba(189, 0, 255, 0.25);
stroke-width: 2px;
transition: all 0.3s ease;
}
.pentagon-node:hover, .pentagon-node.active {
transform: scale(1.05) !important;
z-index: 35;
filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.65)) !important;
}
.pentagon-node:hover polygon, .pentagon-node.active polygon {
fill: rgba(35, 45, 60, 0.4) !important;
stroke: rgba(255, 255, 255, 0.85) !important;
stroke-width: 3px;
}
#info-modal {
display: none;
position: fixed;
bottom: 20px;
left: 50%;
transform: translateX(-50%);
width: 90%;
max-width: 500px;
background: var(--card-bg);
border: 1px solid var(--border-alpha);
border-radius: 8px;
padding: 15px;

.modal-title { font-size: 1rem; font-weight: bold; color: var(--neon-blue); margin-bottom: 6px; text-align: left; }

const modal = document.getElementById('info-modal');
const modalTitle = document.getElementById('info-title');
const modalText = document.getElementById('info-text');
const coreBox = document.getElementById('creator-decree-box');
const closeBtn = document.getElementById('modal-close-btn');

coreBox.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!coreBox.classList.contains('expanded')) {
        document.querySelectorAll('.geo-element').forEach(node => node.classList.remove('active'));
        coreBox.classList.add('expanded');
        const info = ontologyDatabase["c7"];
        if (info) {
            modalTitle.innerText = info.title;
            modalText.innerHTML = info.text;
            modal.style.display = 'block';
        }
    } else {
        alert("Перенаправление в реестр защищенной Консоли Управления. Требуется авторизация криптографическим ключом.");
    }
});

document.querySelectorAll('.geo-element').forEach(element => {
    element.addEventListener('click', (e) => {
        e.stopPropagation();
        if (e.currentTarget === coreBox) return; 
        document.querySelectorAll('.geo-element').forEach(node => node.classList.remove('active'));
        const clickedElement = e.currentTarget;
        clickedElement.classList.add('active');
        const dataId = clickedElement.getAttribute('data-id');
        const info = ontologyDatabase[dataId];
        if (info) {
            modalTitle.innerText = info.title;
            modalText.innerHTML = info.text;
            modal.style.display = 'block';
        }
        if (coreBox.classList.contains('expanded')) {
            resetCoreBox();
        }
    });
});

function resetCoreBox() { coreBox.classList.remove('expanded'); }
function closeModal() {
    modal.style.display = 'none';
    document.querySelectorAll('.geo-element').forEach(node => node.classList.remove('active'));
    resetCoreBox();
}
